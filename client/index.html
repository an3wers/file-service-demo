<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="referrer" content="no-referrer" />
    <script>
      (() => {
        const page = /^\/(activation|password-reset)\/?$/i
          .exec(location.pathname)?.[1]
          ?.toLowerCase();
        const fragment = !!page && !!location.hash;
        const token =
          fragment && new URLSearchParams(location.hash.slice(1)).get("token");
        if (fragment)
          history.replaceState(
            history.state,
            "",
            location.pathname + location.search,
          );
        try {
          const reload =
            performance.getEntriesByType("navigation")[0]?.type === "reload";
          for (const name of ["activation", "password-reset"]) {
            if (name !== page || fragment || !reload) {
              sessionStorage.removeItem(`file-service-${name}-token`);
              sessionStorage.removeItem(`file-service-${name}-form`);
            }
          }
          if (token)
            sessionStorage.setItem(`file-service-${page}-token`, token);
        } catch {}
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (() => {
        let mode = "system";
        try {
          const saved = localStorage.getItem("file-service-theme");
          if (saved === "light" || saved === "dark") mode = saved;
        } catch {}
        const dark =
          mode === "dark" ||
          (mode === "system" &&
            matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
      })();
    </script>
    <title>Файловое хранилище</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
