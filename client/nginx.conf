# Отдача SPA и прокси на API. Файл попадает в /etc/nginx/conf.d/default.conf и
# заменяет дефолтный server-блок образа.
#
# Задача та же, что у `server.proxy` в vite.config.ts во время разработки:
# приложение ходит по относительным путям /api/..., поэтому бэкенд обязан
# отвечать на том же origin. Абсолютного адреса API в бандле нет вообще.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Режим «через сервер» буферизуется в памяти API и ограничен
    # MAX_UPLOAD_SIZE_MB (50 МБ). Потолок nginx держим выше приложения: тогда
    # 413 приходит из API как JSON со стабильным кодом ошибки, а не HTML-страницей
    # nginx, которую клиент показал бы как невнятный «HTTP 413».
    # Части multipart-загрузки идут напрямую в S3 и через nginx не проходят.
    client_max_body_size 64m;

    # Встроенный DNS Docker. Апстрим подставляется через переменную, а не
    # резолвится один раз на старте: иначе nginx запомнил бы IP контейнера
    # server навсегда и отдавал 502 после каждого его пересоздания
    # (`docker compose up -d server`). Заодно nginx спокойно стартует, даже
    # если бэкенд ещё не поднялся.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Наследуется обоими proxy-локациями ниже.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Загрузку отдаём потоком, не накапливая файл во временном каталоге nginx.
    proxy_request_buffering off;
    # Запас на медленные операции: загрузка «через сервер» тянет весь файл, а
    # complete ждёт HeadObject в S3.
    proxy_connect_timeout 10s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # --- API ---
    # $request_uri передаётся как есть: сервер использует originalUrl в тексте
    # 404, и подменять путь незачем.
    location /api {
        set $api_upstream http://server:3000;
        proxy_pass $api_upstream$request_uri;
    }

    # Полезно для проверки деплоя снаружи: /health и /health/ready открыты и не
    # требуют входа.
    location /health {
        set $health_upstream http://server:3000;
        proxy_pass $health_upstream$request_uri;
    }

    # --- статика ---
    # Имена ассетов Vite содержат хеш содержимого, поэтому они неизменяемы.
    location /assets/ {
        try_files $uri =404;
        # Одной директивой, а не `expires 1y` + add_header: та пара выдавала два
        # заголовка Cache-Control сразу, и промежуточные кеши читали бы их
        # по-разному.
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html не кешируем: иначе после обновления браузер продолжит просить
    # старый бандл по именам, которых в образе уже нет.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
